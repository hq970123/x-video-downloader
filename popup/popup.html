<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"></head><body><main><header><div class="brand"><div class="logo">↓</div><div><h1>X 视频下载器</h1><p>快速下载 X 上的公开视频</p></div></div><span class="version">v0.8.2</span></header><section class="card primary"><label class="row"><span><b>在 X 上启用</b><small>在包含视频的帖子下显示下载按钮</small></span><input id="enabled" type="checkbox"></label></section><section class="card"><div class="section-title">下载设置</div><label class="row"><span><b>一键下载最高画质</b><small>单视频帖子直接下载最高画质</small></span><input id="preferBest" type="checkbox"></label><label class="row"><span><b>显示复制链接</b><small>在清晰度菜单中显示复制 MP4 链接</small></span><input id="showCopy" type="checkbox"></label><label class="row"><span><b>重复下载提醒</b><small>重复下载相同清晰度时进行确认</small></span><input id="warnDuplicate" type="checkbox"></label></section><section class="card history"><div class="history-head"><div><div class="section-title no-margin">最近下载</div><small id="historyCount">0 项</small></div><button id="clearHistory">清空</button></div><div id="historyList" class="history-list"></div></section><section class="privacy"><b>隐私保护</b><span>设置和下载历史仅保存在你的浏览器本地。插件仅在 X/Twitter 和 video.twimg.com 上工作。</span></section><footer><button id="diagnostics">复制诊断信息</button><span id="diagState"></span></footer></main><script src="popup.js"></script></body></html>
